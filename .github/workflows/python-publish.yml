# Builds and publishes Tiferet-Ly to PyPI. Triggered on any GitHub Release
# (published), mirroring greatstrength/tiferet's python-publish.yml.
#
# - Tests run for every release.
# - Build validates the version tag, runs twine check, and uploads artifacts.
# - Stable releases (not marked pre-release on GitHub) publish via `publish`.
# - Beta pre-releases (version like X.Y.ZbN, GitHub "pre-release" checked)
#   publish via `publish-pre-release`. Alpha pre-releases (X.Y.ZaN) do not
#   trigger a publish job yet — tiferet-ly's alpha stage is proto-internal;
#   only betas are wired to PyPI for now.

name: Build and Publish Tiferet-Ly

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run tests
        run: |
          pytest --verbose

  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      TIFERET_LY_SILENT_IMPORTS: "1"
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_beta: ${{ steps.get_version.outputs.is_beta }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Extract version from tiferet_ly/__init__.py
        id: get_version
        run: |
          VERSION=$(python -c "from tiferet_ly import __version__; print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" =~ b[0-9]+$ ]]; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate version matches release tag
        run: |
          RELEASE_TAG=${{ github.event.release.tag_name }}
          PACKAGE_VERSION=${{ steps.get_version.outputs.version }}
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Error: Release tag ($RELEASE_TAG) does not match package version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event.release.prerelease == false
    environment: pypi

    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/

  publish-pre-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event.release.prerelease == true && needs.build.outputs.is_beta == 'true'
    environment: pypi

    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: dist/

      - name: Publish to PyPI (pre-release)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
