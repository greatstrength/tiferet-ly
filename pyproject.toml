[project]
name = "tiferet-ly"
version = "0.1.0"
description = "A Tiferet-based wrapper around PLY (Python Lex-Yacc) that lets a small language's vocabulary and grammar be declared rather than hand-wired into PLY's own code-shaped conventions."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
dependencies = [
    "tiferet>=2.0.0b3",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/greatstrength/tiferet-ly"
Repository = "https://github.com/greatstrength/tiferet-ly"

[project.optional-dependencies]
test = [
    "pytest>=8.3.3",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "tiferet_ly",
    "tiferet_ly.domain",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
