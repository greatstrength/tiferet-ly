[project]
name = "tiferet-ly"
dynamic = ["version"]
description = "A Tiferet-based wrapper around PLY (Python Lex-Yacc) that lets a small language's vocabulary and grammar be declared rather than hand-wired into PLY's own code-shaped conventions."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tiferet>=2.2.0,<2.3",
    "pydantic>=2.6,<3",
    "ply>=3.11",
]

[project.urls]
Homepage = "https://github.com/greatstrength/tiferet-ly"
Repository = "https://github.com/greatstrength/tiferet-ly"

[project.optional-dependencies]
test = [
    "pytest>=8.3.3",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tiferet_ly*"]

[tool.setuptools.package-data]
"tiferet_ly.assets" = ["*.yml"]

[tool.setuptools.dynamic]
version = { attr = "tiferet_ly.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
